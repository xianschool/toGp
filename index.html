<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>toGp</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>toGp</h1>
        <div id="result-actions" class="result-actions" hidden>
          <button id="choose-another" class="button button-muted" type="button">选择其他曲谱</button>
          <button id="export-gp" class="button button-primary" type="button">导出 GP5</button>
        </div>
      </header>

      <main>
        <section id="start" class="start">
          <div class="start-copy">
            <p class="intro-copy">
              将清晰的六线谱图片或 PDF 转成可编辑的 Guitar Pro 5 文件。可以点击选择，也可以直接拖入文件；多张图片会自动排序并合并，所有处理都在本机完成。
            </p>
            <button id="choose-file" class="button button-primary button-upload" type="button">
              选择曲谱
            </button>
          </div>
        </section>

        <section id="progress-panel" class="progress" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>识别中…</span>
        </section>

        <section id="error-panel" class="error" role="alert" hidden>
          <p id="error-message"></p>
        </section>

        <section id="result-summary" class="result-summary" aria-live="polite" hidden>
          <div id="result-stats" class="result-stats"></div>
          <details id="result-warnings" class="result-warnings" hidden>
            <summary id="result-warning-summary"></summary>
            <ul id="result-warning-list"></ul>
          </details>
        </section>

        <section id="workspace" class="workspace" hidden>
          <div id="alphaTab"></div>
        </section>
      </main>

      <div id="drop-overlay" class="drop-overlay" aria-hidden="true" hidden>
        <span>松开以识别曲谱</span>
      </div>

      <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
        <div class="about-card">
          <button id="about-close" class="about-close" type="button" aria-label="关闭">×</button>
          <p class="about-kicker">关于我们</p>
          <h2 id="about-title">toGp</h2>
          <p class="about-description">
            一个在本地把扫描乐谱转换成 Guitar Pro 文件的小工具。
          </p>
          <div class="about-contact">
            <span>联系邮箱</span>
            <a id="contact-email" href="mailto:">待填写</a>
          </div>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
