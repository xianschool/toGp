<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>toGp</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>toGp</h1>
        <div id="result-actions" class="result-actions" hidden>
          <button id="choose-another" class="button button-muted" type="button">选择图片</button>
          <button id="export-gp" class="button button-primary" type="button">导出 GP</button>
        </div>
      </header>

      <main>
        <section id="start" class="start">
          <button id="choose-file" class="button button-primary button-upload" type="button">
            选择图片
          </button>
        </section>

        <section id="progress-panel" class="progress" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>识别中…</span>
        </section>

        <section id="error-panel" class="error" role="alert" hidden>
          <p id="error-message"></p>
        </section>

        <section id="workspace" class="workspace" hidden>
          <div id="alphaTab"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
